<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>memexvault</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
  <!-- Vault heavy outer ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#57534e" stroke-width="28"/>
  <!-- 4 heavy locking bolts -->
  <line x1="256" y1="68" x2="256" y2="108" stroke="#f59e0b" stroke-width="26" stroke-linecap="round"/>
  <line x1="256" y1="404" x2="256" y2="444" stroke="#f59e0b" stroke-width="26" stroke-linecap="round"/>
  <line x1="68" y1="256" x2="108" y2="256" stroke="#f59e0b" stroke-width="26" stroke-linecap="round"/>
  <line x1="404" y1="256" x2="444" y2="256" stroke="#f59e0b" stroke-width="26" stroke-linecap="round"/>
  <!-- Vault inner core -->
  <circle cx="256" cy="256" r="126" fill="#292524" stroke="#d97706" stroke-width="16"/>
  <!-- Central memory diamond jewel -->
  <rect x="196" y="196" width="120" height="120" rx="28" transform="rotate(45 256 256)" fill="#fbbf24"/>
  <circle cx="256" cy="256" r="32" fill="#ffffff"/>
</svg>
