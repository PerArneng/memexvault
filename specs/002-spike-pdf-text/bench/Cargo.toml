[package]
name = "pdf-bench"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
pdf_oxide = { version = "=0.3.78", features = ["rendering"] }
hayro = "=0.9.0"
lopdf = "=0.47.0"
pdfium-render = { version = "=0.9.5", features = ["image_latest"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
[profile.release]
debug = false
