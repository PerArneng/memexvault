[package]
name = "agent-bench"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
adk-agent = "=2.3.0"
adk-core = "=2.3.0"
adk-model = { version = "=2.3.0", features = ["gemini", "openai"] }
adk-runner = "=2.3.0"
adk-session = "=2.3.0"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }
reqwest = { version = "0.13", default-features = false }
