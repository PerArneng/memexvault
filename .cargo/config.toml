# Where pdfium-render finds the statically linked pdfium on macOS, and memex-pdf finds libpdfium.so elsewhere when it isn't beside the binary. scripts/fetch-pdfium.sh puts it there.
[env]
PDFIUM_STATIC_LIB_PATH = { value = "vendor/pdfium/release/lib", relative = true }
MEMEX_PDFIUM_VENDOR_DIR = { value = "vendor/pdfium/release/lib", relative = true }
