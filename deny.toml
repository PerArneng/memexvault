# Licence check. Anything outside this list fails, including AGPL and GPL.
# NCSA is permissive. It comes in through the image crate's AV1 encoder, and nothing we call uses it.
# MIT-0 is MIT without the attribution clause. It comes in through jsonschema's URI handling (spec 023).
[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0", "BSL-1.0", "0BSD", "NCSA", "MIT-0"]
confidence-threshold = 0.9
