[package]
name = "memex-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
memex-types.workspace = true
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_7881", "image_latest", "thread_safe"] }

# macOS links pinned pdfium statically. No static Linux build is published, so Linux loads the pinned libpdfium.so at runtime (spec 091).
[target.'cfg(target_os = "macos")'.dependencies]
pdfium-render = { version = "=0.9.5", default-features = false, features = ["static", "libc++", "core_graphics"] }

[dev-dependencies]
memex-core.workspace = true
serde_json.workspace = true

[lints]
workspace = true
