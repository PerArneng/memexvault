[package]
name = "memex-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum.workspace = true
base64 = "0.22"
http = "1"
memex-api.workspace = true
memex-core.workspace = true
memex-types.workspace = true
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[dev-dependencies]
memex-http.workspace = true
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
sha2.workspace = true
tiktoken-rs = "0.9"
tokio = { workspace = true, features = ["io-util", "time"] }

[lints]
workspace = true
